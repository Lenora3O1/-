<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>公司管理後台｜社區交接清冊</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"><div><div class="brand">公司管理後台</div><div class="sub" id="tenantName">物業管理公司</div></div><div id="logoutWrap" style="display:none"><button class="top-link" id="logoutBtn">登出</button></div></div>
<div class="shell">
<div id="loginView" class="panel login-box"><h2>🔐 公司管理員登入</h2><p class="hint">這裡是公司專屬管理後台。登入後可開通人員、管理社區與查看本公司交接紀錄。</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>公司管理員員編</label><input type="text" id="employeeId" required autocomplete="username"></div><div class="field"><label>密碼</label><input type="password" id="password" required autocomplete="current-password"></div><button type="submit">登入公司管理後台</button></form></div>
<div id="mainView" style="display:none"><div class="panel designer-intro"><strong>🏢 公司管理後台</strong><p class="hint">這裡只管理您所屬公司的資料。您可以自行開通一般人員、設定社區權限，以及查看本公司的正式交接紀錄。</p></div>
<div class="nav-tabs"><button data-tab="overview" class="active">🏠 管理首頁</button><button data-tab="staff">👥 人員管理</button><button data-tab="communities">🏘 社區管理</button><button data-tab="submissions">📋 交接紀錄</button><button data-tab="templates">📄 Word 範本</button></div>
<div id="tab-overview"></div><div id="tab-staff" style="display:none"></div><div id="tab-communities" style="display:none"></div><div id="tab-submissions" style="display:none"></div><div id="tab-templates" style="display:none"></div>
</div></div><script src="company.js"></script></body></html>
