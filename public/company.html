<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>公司管理後台</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"><div><div class="brand">公司管理後台</div><div class="sub">僅限本公司管理員</div></div><div id="logoutWrap" style="display:none"><button class="top-link" id="logoutBtn">登出</button></div></div>
<div class="shell"><div id="loginView" class="panel login-box" style="display:none"><h2>🏢 公司管理員登入</h2><p class="hint">這裡只管理您所屬公司的帳號、社區與交接紀錄，不會看到其他公司的資料。</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>管理員員編</label><input id="employeeId" required autocomplete="username" placeholder="例如：CA001"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit">登入公司後台</button></form><p class="hint" style="margin-top:18px">系統總管理員請前往 <a class="link" href="admin.html">總後臺</a>。</p></div>
<div id="mainView" style="display:none"><div class="company-head panel"><div><div class="eyebrow">🏢 公司空間</div><h1 id="tenantName">—</h1><p class="hint">這裡的所有操作都只會作用於目前登入的公司。</p></div><a class="btn secondary" href="/">← 回填表前台</a></div><div class="nav-tabs"><button data-tab="overview" class="active">總覽</button><button data-tab="staff">人員管理</button><button data-tab="communities">社區管理</button><button data-tab="submissions">交接紀錄</button><button data-tab="templates">Word 範本</button></div><div id="tab-overview"></div><div id="tab-staff" style="display:none"></div><div id="tab-communities" style="display:none"></div><div id="tab-submissions" style="display:none"></div><div id="tab-templates" style="display:none"></div></div></div><script src="company.js"></script></body></html>
