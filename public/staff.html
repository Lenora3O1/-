<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>我的工作台｜社區交接清冊</title><link rel="stylesheet" href="styles.css"></head><body><div class="topbar"><div><div class="brand">我的工作台</div><div class="sub">社區交接清冊｜物業人員</div></div><div id="staffTop" class="staff-top" style="display:none"><span id="staffName"></span><button class="top-link" id="staffLogout">登出</button></div></div><div class="shell"><div id="loginView" class="panel login-box"><h2>👤 人員工作台</h2><p class="hint">使用公司提供的員編＋密碼登入。您只能看到自己被授權的社區與自己的交接草稿。</p><div id="loginMsg"></div><form id="staffLoginForm"><div class="field"><label>員編</label><input id="employeeId" autocomplete="username" required placeholder="例如：A001"></div><div class="field"><label>密碼</label><input id="employeePassword" type="password" autocomplete="current-password" required></div><button type="submit">登入工作台</button></form></div><div id="homeView" style="display:none"><div id="staffHome"></div></div><div id="editorView" style="display:none"><div id="draftBar" class="draft-bar"></div><div id="progressArea" class="progress-area"></div><div id="msgArea"></div><form id="checklistForm"></form></div></div><script src="app.js"></script></body></html>
