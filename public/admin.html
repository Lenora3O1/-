<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>交接清冊｜系統總後臺</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"><div><div class="brand">交接清冊｜系統總後臺</div><div class="sub">System Owner / Super Admin</div></div><div id="logoutWrap" style="display:none"><button class="top-link" id="logoutBtn">登出</button></div></div>
<div class="shell"><div id="loginView" class="panel login-box" style="display:none"><h2>🔐 系統總管理員登入</h2><p class="hint">這裡是系統擁有者的總後臺。可以建立物業管理公司、查看全系統資料與管理中央表單。</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>總後臺帳號</label><input type="text" id="username" required autocomplete="username"></div><div class="field"><label>總後臺密碼</label><input type="password" id="password" required autocomplete="current-password"></div><button type="submit">登入總後臺</button></form></div>
